name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Rust Checks & Server Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy checks
        run: cargo clippy -p pg-interleave-server -- -D warnings

      - name: Run Rust unit tests
        run: cargo test

      - name: Build pg-interleave release binary
        run: cargo build --release -p pg-interleave-server

      - name: Upload compiled server binary
        uses: actions/upload-artifact@v4
        with:
          name: pg-interleave-server-linux
          path: target/release/pg-interleave-server
          retention-days: 1

  matrix-test:
    name: Test (Node ${{ matrix.node }}, PG ${{ matrix.postgres }})
    needs: lint-and-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        postgres: [14, 15, 16]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download compiled proxy binary
        uses: actions/download-artifact@v4
        with:
          name: pg-interleave-server-linux
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/pg-interleave-server

      - name: Start pg-interleave proxy in background
        run: |
          ./target/release/pg-interleave-server --listen-addr 127.0.0.1:5433 --target-addr 127.0.0.1:5432 --control-addr 127.0.0.1:9090 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9090/events > /dev/null; then
              echo "pg-interleave proxy is ready"
              break
            fi
            echo "Waiting for pg-interleave..."
            sleep 0.2
          done

      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: npm ci

      - name: Typecheck SDK
        working-directory: packages/sdk-ts
        run: npx tsc --noEmit

      - name: Run Vitest Integration Tests
        working-directory: packages/sdk-ts
        run: npm test

      - name: Verify libpq / psql extended pipeline with deadlock recovery
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          curl -s -X POST http://127.0.0.1:9090/reset

          curl -s -X POST http://127.0.0.1:9090/intercept \
            -H "Content-Type: application/json" \
            -d '{"query_pattern": "SELECT \\$1::int", "action": "synthetic_deadlock", "times": 1}'

          OUTPUT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v VERBOSITY=verbose 2>&1 << 'EOF'
          SELECT $1::int AS v \bind 1 \g
          SELECT $1::int AS v \bind 2 \g
          SELECT $1::int AS v \bind 3 \g
          EOF
          )

          echo "$OUTPUT"

          echo "$OUTPUT" | grep -q "40P01" || { echo "Missing 40P01 deadlock error"; exit 1; }
          echo "$OUTPUT" | grep -qx " 2" || { echo "Query 2 wrong"; exit 1; }
          echo "$OUTPUT" | grep -qx " 3" || { echo "Query 3 wrong"; exit 1; }
          echo "psql pipeline test passed!"
